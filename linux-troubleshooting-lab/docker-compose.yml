services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: sandbox
    image: linuxlab-sandbox:latest
    container_name: linuxlab-sandbox
    hostname: prod-app-server-01
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      - TERM=xterm-256color

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: linuxlab-web:latest
    container_name: linuxlab-web
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - linuxlab-data:/root/.linuxlab
    depends_on:
      - sandbox
    environment:
      - TERM=xterm-256color
      - PORT=8088
      - HOST=0.0.0.0
      - LINUXLAB_STATE_DIR=/root/.linuxlab
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  linuxlab-data:
